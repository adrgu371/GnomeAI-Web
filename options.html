<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebGnome Settings</title>
  <style>
    body {
      background: #1e1e1e;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      padding: 30px;
      max-width: 500px;
      margin: 0 auto;
    }
    h1 { border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; color: #4aa8ff; }
    label { display: block; margin-bottom: 8px; font-weight: bold; margin-top: 15px; }
    input {
      width: 100%;
      padding: 12px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
      box-sizing: border-box; /* Important pentru padding corect */
    }
    input:focus { outline: 1px solid #4aa8ff; border-color: #4aa8ff; }
    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button:active { transform: scale(0.98); }
    #status {
      margin-top: 15px;
      text-align: center;
      color: #4ade80; /* Verde */
      height: 20px;
      font-weight: 500;
    }
    .hint { font-size: 12px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>

  <h1>⚙️ WebGnome Settings</h1>

  <label for="model">Ollama Model</label>
  <input type="text" id="model" placeholder="ex: granite4:3b">
  <div class="hint">Asigurați-vă că ați rulat `ollama pull [nume]`</div>

  <label for="key">Brave Search API Key</label>
  <input type="password" id="key" placeholder="Lipiți cheia API aici...">
  <div class="hint">Obțineți cheia gratuit de pe brave.com/search/api</div>

  <button id="save">Save Settings</button>
  
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
